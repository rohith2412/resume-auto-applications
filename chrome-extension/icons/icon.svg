<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Black rounded square background -->
  <rect width="128" height="128" rx="28" ry="28" fill="#0a0a0a"/>

  <!-- White 3-leaf shamrock -->
  <g fill="#ffffff">
    <!-- Top-left heart leaf -->
    <path d="M 50 52
             C 42 38, 24 38, 24 54
             C 24 62, 30 68, 38 70
             C 42 71, 48 70, 52 64
             C 56 58, 54 58, 50 52 Z"/>
    <!-- Top-right heart leaf -->
    <path d="M 78 52
             C 86 38, 104 38, 104 54
             C 104 62, 98 68, 90 70
             C 86 71, 80 70, 76 64
             C 72 58, 74 58, 78 52 Z"/>
    <!-- Bottom heart leaf -->
    <path d="M 64 96
             C 56 100, 44 96, 44 80
             C 44 72, 50 66, 58 64
             C 62 63, 66 64, 68 68
             C 72 76, 72 92, 64 96 Z"/>
    <!-- Curving stem -->
    <path d="M 64 78
             Q 62 92, 56 104
             Q 54 108, 56 112
             L 60 112
             Q 60 108, 62 104
             Q 66 92, 68 80 Z"/>
  </g>
</svg>
